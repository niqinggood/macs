<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f6f7f9;color:#172033;min-height:100vh}
.container{max-width:1040px;margin:0 auto;padding:28px 20px}
.back-btn{display:inline-block;padding:8px 14px;background:#fff;border:1px solid #d9dee7;border-radius:6px;cursor:pointer;font-size:calc(14.3px * var(--macs-font-scale, 1));color:#42526b;text-decoration:none;margin-bottom:16px}
.back-btn:hover{background:#f1f4f8}
.header{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid #d9dee7}
.header h1{font-size:calc(24.2px * var(--macs-font-scale, 1));color:#0f172a;margin-bottom:8px}
.meta{font-size:calc(14.3px * var(--macs-font-scale, 1));color:#667085;display:flex;gap:14px;flex-wrap:wrap}
.card{background:#fff;border:1px solid #e3e8ef;border-radius:8px;padding:18px 20px;margin-bottom:14px}
.card-title{font-size:calc(13.2px * var(--macs-font-scale, 1));font-weight:700;color:#667085;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.task-input{font-size:calc(15.4px * var(--macs-font-scale, 1));color:#243247;line-height:1.65;white-space:pre-wrap}
.delivery{border-color:#b7e4c7;background:#f8fff9}
.delivery .card-title{color:#16703c}
.final-step{font-weight:600;font-size:calc(14.3px * var(--macs-font-scale, 1));color:#16703c;margin-bottom:8px}
.delivery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0 12px}
.delivery-metric{background:#fff;border:1px solid #e3e8ef;border-radius:6px;padding:9px 10px}
.delivery-metric b{display:block;font-size:calc(19.8px * var(--macs-font-scale, 1));color:#172033;line-height:1.1}
.delivery-metric span{font-size:calc(12.1px * var(--macs-font-scale, 1));color:#667085}
.risk-low{color:#16703c}.risk-medium{color:#b45309}.risk-high{color:#b42318}
.delivery-list{margin:8px 0 0 18px;color:#475569;font-size:calc(14.3px * var(--macs-font-scale, 1));line-height:1.6}
.diagnosis{border-color:#fecaca;background:#fffafa}
.diagnosis .card-title{color:#b42318}
.diagnosis-summary{font-size:calc(15.4px * var(--macs-font-scale, 1));font-weight:700;color:#991b1b;margin-bottom:8px}
.cause{border:1px solid #fee2e2;background:#fff;border-radius:6px;padding:9px 10px;margin:7px 0}
.cause-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:calc(13.2px * var(--macs-font-scale, 1));margin-bottom:4px}
.cause-code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#fee2e2;color:#991b1b;border-radius:4px;padding:2px 5px}
.cause-severity{font-size:calc(12.1px * var(--macs-font-scale, 1));color:#b45309}
.cause-msg{font-size:calc(14.3px * var(--macs-font-scale, 1));color:#334155;line-height:1.5}
.cause-evidence{font-size:calc(12.1px * var(--macs-font-scale, 1));color:#64748b;margin-top:4px;white-space:pre-wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.action-link{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid #d9dee7;border-radius:6px;background:#fff;color:#334155;text-decoration:none;font-size:calc(13.2px * var(--macs-font-scale, 1))}
.action-link:hover{background:#f8fafc}
button.action-link{cursor:pointer;font-family:inherit}
.log-card{border-color:#c7d2fe;background:#fbfcff}
.log-card .card-title{color:#4659c9}
.job-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #e8edf5;font-size:calc(14.3px * var(--macs-font-scale, 1))}
.job-row:last-child{border-bottom:0}
.job-main{min-width:0}
.job-command{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:620px;color:#273449}
.job-meta{font-size:calc(12.1px * var(--macs-font-scale, 1));color:#8793a3;margin-top:3px}
.status-pill{font-size:calc(12.1px * var(--macs-font-scale, 1));padding:2px 7px;border-radius:999px;background:#eef2ff;color:#4659c9}
.step{margin-bottom:14px;padding-left:24px;border-left:3px solid #e5e7eb;position:relative}
.step.completed{border-left-color:#5b6ee1}
.step.running{border-left-color:#d97706}
.step.failed{border-left-color:#dc2626}
.step-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.step-num{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:calc(12.1px * var(--macs-font-scale, 1));font-weight:700;color:#fff;flex-shrink:0;background:#b8c0cc}
.step.completed .step-num{background:#5b6ee1}
.step.running .step-num{background:#d97706}
.step.failed .step-num{background:#dc2626}
.step-name{font-weight:600;font-size:calc(15.4px * var(--macs-font-scale, 1))}
.step-status{font-size:calc(12.1px * var(--macs-font-scale, 1));padding:2px 8px;border-radius:10px;background:#f1f5f9;color:#475569}
.step-output{font-size:calc(14.3px * var(--macs-font-scale, 1));line-height:1.7;color:#374151;margin:8px 0;padding:12px 14px;background:#f8fafc;border-radius:6px;overflow:auto}
.step-output code{background:#e2e8f0;padding:1px 4px;border-radius:3px;font-size:.9em}
.step-output pre{background:#1e293b;color:#dbe4f0;padding:12px 14px;border-radius:6px;overflow-x:auto;font-size:calc(13.2px * var(--macs-font-scale, 1));margin:8px 0}
.step-error{color:#dc2626;font-size:calc(13.2px * var(--macs-font-scale, 1));margin:4px 0}
details{margin:8px 0}
summary{cursor:pointer;font-size:calc(13.2px * var(--macs-font-scale, 1));color:#536170;user-select:none}
.tools{padding-left:0;margin:6px 0}
.tool-call{font-size:calc(12.1px * var(--macs-font-scale, 1));padding:5px 8px;margin:3px 0;background:#f1f5f9;border-radius:4px;display:flex;align-items:center;gap:8px}
.tool-name{font-weight:600;color:#4659c9}
.tool-duration{color:#8793a3}
.tool-params{color:#475569;font-size:calc(11px * var(--macs-font-scale, 1));overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:520px}
.audit-item{font-size:calc(13.2px * var(--macs-font-scale, 1));padding:4px 0;display:flex;align-items:center;gap:6px}
.loading{text-align:center;padding:48px;color:#8793a3;font-size:calc(15.4px * var(--macs-font-scale, 1))}
.error{text-align:center;padding:48px;color:#dc2626}
pre{white-space:pre-wrap}
</style>
</head>
<body>
<div class="container">
<a href="javascript:history.back()" class="back-btn">&larr; 返回</a>
<div id="content"><div class="loading">加载中...</div></div>
</div>

<script>
function escHtml(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function escJs(s){return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'')}
function formatTime(t){if(!t)return'';return new Date(t).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function markdownToHtml(t){try{return marked.parse(t)}catch(e){return escHtml(t).replace(/\n/g,'<br>')}}
function cleanOutput(t){return (t||'').replace(/<think>[\s\S]*?<\/think>/g,'').trim()}
function displayInput(input){
    input = input || '';
    var marker = '\n\n---\n\n';
    var idx = input.lastIndexOf(marker);
    return idx >= 0 ? input.slice(idx + marker.length).trim() : input.trim();
}
function getFinalStep(steps){
    for (var i = steps.length - 1; i >= 0; i--) {
        if (steps[i].status === 'completed' && cleanOutput(steps[i].output)) return steps[i];
    }
    return null;
}
function finalOutput(exec, steps){
    if (cleanOutput(exec.final_output)) {
        return {name: exec.final_step_name || '最终结果', output: cleanOutput(exec.final_output)};
    }
    var step = getFinalStep(steps);
    return step ? {name: step.name, output: cleanOutput(step.output)} : null;
}
function artifactLinks(text){
    var out = [];
    var seen = {};
    var re = /(?:^|[\s`"'(])((?:\.openkitty\/storage|storage)\/[^\s`"')<>]+)/g;
    var m;
    while ((m = re.exec(text || '')) && out.length < 8) {
        var path = m[1].replace(/[.,;:，。；：]+$/,'');
        if (seen[path]) continue;
        seen[path] = true;
        out.push(path);
    }
    return out;
}
function fileLink(path){
    var url = '/api/files/download?path=' + encodeURIComponent(path);
    return '<a class="action-link" href="'+url+'" target="_blank">下载 '+escHtml(path.split('/').pop())+'</a>';
}
function renderArtifactActions(text){
    var links = artifactLinks(text);
    if (!links.length) return '';
    return '<div class="actions">'+links.map(fileLink).join('')+'</div>';
}
function artifactActionLinks(artifacts){
    artifacts = artifacts || [];
    if (!artifacts.length) return '';
    var html = '<div class="actions">';
    artifacts.forEach(function(a){
        var path = a.path || '';
        var href = a.download_url || ('/api/files/download?path=' + encodeURIComponent(path));
        var name = path.split('/').pop() || path || 'artifact';
        var step = a.source_step ? ' <span style="color:#8793a3">('+escHtml(a.source_step)+')</span>' : '';
        html += '<a class="action-link" href="'+escHtml(href)+'" target="_blank">下载 '+escHtml(name)+step+'</a>';
    });
    html += '</div>';
    return html;
}
function renderDeliverySummary(exec){
    var d = exec.delivery || null;
    if (!d) return '';
    var risk = d.risk_level || 'low';
    var html = '<div class="card delivery"><div class="card-title">交付摘要</div>';
    html += '<div class="delivery-grid">';
    html += '<div class="delivery-metric"><b>'+escHtml(d.status || exec.status || 'unknown')+'</b><span>状态</span></div>';
    html += '<div class="delivery-metric"><b>'+(d.completed_steps||0)+'/'+(d.total_steps||0)+'</b><span>步骤</span></div>';
    html += '<div class="delivery-metric"><b>'+(d.tool_calls||0)+'</b><span>工具调用</span></div>';
    html += '<div class="delivery-metric"><b>'+(d.estimated_credits||0)+'</b><span>Credits</span></div>';
    if (d.evidence) {
        html += '<div class="delivery-metric"><b>'+(d.evidence.source_count||0)+'</b><span>Sources</span></div>';
        html += '<div class="delivery-metric"><b>'+escHtml(d.evidence.level||'none')+'</b><span>Evidence</span></div>';
    }
    html += '<div class="delivery-metric"><b class="risk-'+escHtml(risk)+'">'+escHtml(risk)+'</b><span>风险</span></div>';
    html += '</div>';
    if (d.completion_reason) {
        var cr = d.completion_reason;
        var crText = (cr.code || 'unknown') + (cr.step_name ? ' @ ' + cr.step_name : '') + (cr.condition ? ' | ' + cr.condition : '');
        html += '<ul class="delivery-list"><li>Completion reason: '+escHtml(crText)+'</li></ul>';
    }
    if (d.artifacts && d.artifacts.length) html += artifactActionLinks(d.artifacts);
    if (d.credit_breakdown && d.credit_breakdown.length) {
        html += '<ul class="delivery-list">';
        d.credit_breakdown.slice(0,6).forEach(function(c){ html += '<li>'+escHtml(c)+'</li>'; });
        html += '</ul>';
    }
    if (d.evidence && d.evidence.warnings && d.evidence.warnings.length) {
        html += '<ul class="delivery-list">';
        d.evidence.warnings.slice(0,4).forEach(function(w){ html += '<li>'+escHtml(w)+'</li>'; });
        html += '</ul>';
    }
    if (d.evidence && d.evidence.sources && d.evidence.sources.length) {
        html += '<ul class="delivery-list">';
        d.evidence.sources.slice(0,5).forEach(function(s){
            var label = s.title || s.url;
            html += '<li><a href="'+escHtml(s.url)+'" target="_blank">'+escHtml(label)+'</a>';
            if (s.type) html += ' · '+escHtml(s.type);
            if (s.step_name) html += ' · '+escHtml(s.step_name);
            html += '</li>';
        });
        html += '</ul>';
    }
    if (d.risks && d.risks.length) {
        html += '<ul class="delivery-list">';
        d.risks.slice(0,4).forEach(function(r){ html += '<li>'+escHtml(r)+'</li>'; });
        html += '</ul>';
    }
    if (d.next_actions && d.next_actions.length) {
        html += '<ul class="delivery-list">';
        d.next_actions.slice(0,3).forEach(function(a){ html += '<li>'+escHtml(a)+'</li>'; });
        html += '</ul>';
    }
    html += '</div>';
    return html;
}
function renderDiagnosis(exec){
    var d = exec.delivery && exec.delivery.diagnosis ? exec.delivery.diagnosis : null;
    if (!d || d.status === 'ok' || !((d.causes && d.causes.length) || (d.artifact_issues && d.artifact_issues.length))) return '';
    var html = '<div class="card diagnosis"><div class="card-title">Failure Diagnosis</div>';
    html += '<div class="diagnosis-summary">'+escHtml(d.summary || 'Execution needs attention')+'</div>';
    (d.causes || []).slice(0,8).forEach(function(c){
        html += '<div class="cause">';
        html += '<div class="cause-head"><span class="cause-code">'+escHtml(c.code||'unknown')+'</span>';
        html += '<span class="cause-severity">'+escHtml(c.severity||'')+'</span>';
        if (c.step) html += '<span style="color:#64748b">step: '+escHtml(c.step)+'</span>';
        html += '</div>';
        html += '<div class="cause-msg">'+escHtml(c.message||'')+'</div>';
        if (c.evidence) html += '<div class="cause-evidence">'+escHtml(c.evidence)+'</div>';
        html += '</div>';
    });
    if (d.artifact_issues && d.artifact_issues.length) {
        html += '<ul class="delivery-list">';
        d.artifact_issues.slice(0,6).forEach(function(item){ html += '<li>'+escHtml(item)+'</li>'; });
        html += '</ul>';
    }
    if (d.recommendations && d.recommendations.length) {
        html += '<ul class="delivery-list">';
        d.recommendations.slice(0,6).forEach(function(item){ html += '<li>'+escHtml(item)+'</li>'; });
        html += '</ul>';
    }
    html += '</div>';
    return html;
}
async function loadShellJobs(){
    try {
        var r = await fetch('/api/shell/jobs');
        if (!r.ok) return [];
        var data = await r.json();
        return data.jobs || [];
    } catch(e) {
        return [];
    }
}
function downloadShellJobLog(jobId){
    if (!jobId) return;
    var url = '/api/shell/jobs/download?id=' + encodeURIComponent(jobId);
    var a = document.createElement('a');
    a.href = url;
    a.download = '';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ document.body.removeChild(a); }, 1000);
}
function downloadPipelineLog(execId){
    if (!execId) return;
    var url = '/api/pipeline/log/download?id=' + encodeURIComponent(execId);
    var a = document.createElement('a');
    a.href = url;
    a.download = '';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ document.body.removeChild(a); }, 1000);
}
function collectShellJobIds(steps){
    var ids = {};
    (steps || []).forEach(function(s){
        var text = [s.output || '', s.error || ''].join('\n');
        var re = /job_id:\s*([A-Za-z0-9_.-]+)/g;
        var m;
        while ((m = re.exec(text))) ids[m[1]] = true;
    });
    return ids;
}
function filterShellJobsForExecution(jobs, execId, steps){
    var ids = collectShellJobIds(steps);
    return (jobs || []).filter(function(j){return j.task_id === execId || j.id === execId || ids[j.id]});
}
function renderShellJobs(jobs){
    if (!jobs || !jobs.length) return '';
    var html = '<div class="card log-card"><div class="card-title">运行日志</div>';
    jobs.forEach(function(job){
        var rawId = job.id || '';
        var id = encodeURIComponent(rawId);
        html += '<div class="job-row">';
        html += '<div class="job-main">';
        html += '<div><span class="status-pill">'+escHtml(job.status||'unknown')+'</span></div>';
        html += '<div class="job-command">'+escHtml(job.command||job.id||'shell job')+'</div>';
        html += '<div class="job-meta">job: '+escHtml(job.id||'')+' · pid: '+escHtml(job.pid||'')+' · '+formatTime(job.started_at)+'</div>';
        html += '</div><div class="actions">';
        html += '<a class="action-link" href="/api/shell/jobs/log?id='+id+'" target="_blank">查看日志</a>';
        html += '<button type="button" class="action-link" onclick="downloadShellJobLog(\''+escJs(rawId)+'\')">下载日志</button>';
        html += '</div></div>';
    });
    html += '</div>';
    return html;
}

async function load() {
    var q = new URLSearchParams(location.search);
    var id = q.get('id');
    if (!id) {
        document.getElementById('content').innerHTML = '<div class="error">缺少执行 ID 参数</div>';
        return;
    }

    var exec;
    try {
        var r = await fetch('/api/pipeline/status/' + encodeURIComponent(id));
        if (!r.ok) throw new Error('Not found');
        exec = await r.json();
    } catch(e) {
        try {
            var r2 = await fetch('/api/pipeline/executions');
            var data = await r2.json();
            exec = (data.executions||[]).find(function(e){return e.id===id});
            if (!exec) throw new Error('Not found');
        } catch(e2) {
            document.getElementById('content').innerHTML = '<div class="error">执行记录未找到: '+escHtml(id)+'</div>';
            return;
        }
    }

    var steps = exec.steps || [];
    var audit = exec.audit_log || [];
    var shellJobs = filterShellJobsForExecution(await loadShellJobs(), exec.id, steps);
    var html = '';
    var stColor = exec.status==='completed'?'#10b981':exec.status==='running'?'#5b6ee1':exec.status==='failed'?'#dc2626':'#6b7280';

    html += '<div class="header">';
    html += '<h1>'+escHtml(exec.pipeline_name||'执行详情')+'</h1>';
    html += '<div class="meta">';
    html += '<span>ID: '+escHtml(exec.id)+'</span>';
    html += '<span>状态: <b style="color:'+stColor+'">'+escHtml(exec.status||'unknown')+'</b></span>';
    html += '<span>创建: '+formatTime(exec.created_at)+'</span>';
    html += '<span>步骤: '+(exec.current_step||0)+'/'+steps.length+'</span>';
    html += '</div></div>';
    html += '<div class="card log-card"><div class="card-title">执行日志</div><div class="actions">';
    html += '<button type="button" class="action-link" onclick="downloadPipelineLog(\''+escJs(exec.id)+'\')">下载日志</button>';
    html += '</div></div>';
    html += renderDeliverySummary(exec);
    html += renderDiagnosis(exec);

    var shownInput = displayInput(exec.input);
    if (shownInput) {
        html += '<div class="card"><div class="card-title">收到的任务</div>';
        html += '<div class="task-input">'+escHtml(shownInput.substring(0,1000))+'</div></div>';
    }

    var final = finalOutput(exec, steps);
    if (final) {
        html += '<div class="card delivery"><div class="card-title">最终交付</div>';
        html += '<div class="final-step">'+escHtml(final.name)+'</div>';
        html += '<div class="step-output" style="background:#fff;border:1px solid #d9f2df">'+markdownToHtml(final.output)+'</div>';
        html += renderArtifactActions(final.output);
        html += artifactActionLinks(exec.artifacts || (exec.delivery && exec.delivery.artifacts) || []);
        html += '</div>';
    }

    html += renderShellJobs(shellJobs);

    html += '<div class="card"><div class="card-title">执行过程 ('+steps.length+' 步)</div>';
    steps.forEach(function(s,i){
        var cls = s.status || 'pending';
        html += '<div class="step '+escHtml(cls)+'">';
        html += '<div class="step-header">';
        html += '<span class="step-num">'+(i+1)+'</span>';
        html += '<span class="step-name">'+escHtml(s.name)+'</span>';
        html += '<span class="step-status">'+escHtml(s.status||'pending')+'</span>';
        if (s.duration_ms) html += '<span style="font-size:calc(11px * var(--macs-font-scale, 1));color:#8793a3">'+(s.duration_ms/1000).toFixed(1)+'s</span>';
        html += '</div>';
        var stepOutput = cleanOutput(s.output);
        if (stepOutput) {
            html += '<details><summary>查看该步骤输出</summary>';
            html += '<div class="step-output">'+markdownToHtml(stepOutput)+'</div></details>';
        }
        if (s.error) html += '<div class="step-error">Error: '+escHtml(s.error)+'</div>';
        if (s.tool_calls && s.tool_calls.length > 0) {
            html += '<details><summary>工具调用 ('+s.tool_calls.length+')</summary><div class="tools">';
            s.tool_calls.forEach(function(tc){
                html += '<div class="tool-call">';
                html += '<span class="tool-name">'+escHtml(tc.tool_name)+'</span>';
                html += '<span class="tool-duration">'+(tc.duration_ms||0)+'ms</span>';
                if (tc.params) html += '<span class="tool-params">'+escHtml(String(tc.params).substring(0,180))+'</span>';
                html += '</div>';
            });
            html += '</div></details>';
        }
        html += '</div>';
    });
    html += '</div>';

    if (audit.length > 0) {
        html += '<div class="card"><div class="card-title">审批记录</div>';
        audit.forEach(function(a){
            var label = a.action==='approved'?'通过':a.action==='rejected'?'拒绝':a.action==='feedback'?'反馈':a.action==='stopped'?'停止':'记录';
            html += '<div class="audit-item"><b>'+escHtml(a.role||'')+'</b> '+label+' ';
            if (a.feedback && a.feedback!=='ok') html += '<span style="color:#64748b">"'+escHtml(String(a.feedback).substring(0,200))+'"</span> ';
            html += '<span style="color:#8793a3;font-size:calc(12.1px * var(--macs-font-scale, 1))">'+formatTime(a.timestamp)+'</span></div>';
        });
        html += '</div>';
    }

    document.getElementById('content').innerHTML = html;
}

load();
</script>
</body>
</html>
