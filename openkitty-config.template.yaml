heartbeat:
    enabled: false
    interval: 30
pipeline:
    pipelines: {}
mcp_servers:
    # Local MCP server over stdio. Child process inherits the OpenKitty environment.
    - name: local-tools
      enabled: false
      transport: stdio
      command: npx
      args: ["-y", "@modelcontextprotocol/server-filesystem", "."]
      env: []
      cwd: ""
      tool_prefix: ""
      timeout_seconds: 30
    # Remote MCP server. "auto" tries Streamable HTTP first and falls back to legacy SSE.
    - name: remote-tools
      enabled: false
      transport: auto
      url: https://example.com/mcp
      token: ""
      headers: {}
      tool_prefix: ""
      timeout_seconds: 30
